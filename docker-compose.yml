# Local API + Postgres only. Deploy the API repo to Render; do not run Open-Meteo here.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cleanair
      POSTGRES_PASSWORD: cleanair
      POSTGRES_DB: cleanair
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      PORT: 4000
      DATABASE_URL: postgres://cleanair:cleanair@postgres:5432/cleanair
      AIR_QUALITY_SOURCE: sample
      CHAT_MODE: stub
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      - postgres

volumes:
  pgdata:
