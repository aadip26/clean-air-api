# Render Blueprint: https://render.com/docs/blueprint-spec
databases:
  - name: cleanair-db
    plan: free
    databaseName: cleanair
    user: cleanair

services:
  - type: web
    name: cleanair-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cleanair-db
          property: connectionString
      - key: AIR_QUALITY_SOURCE
        value: sample
      - key: CHAT_MODE
        value: stub
      - key: CORS_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
